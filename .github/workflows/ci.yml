name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until the project is scaffolded
        id: has
        run: test -f package.json && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has.outputs.ok == 'true'
        with: { node-version: 22, cache: npm }
      - if: steps.has.outputs.ok == 'true'
        run: npm ci
      - if: steps.has.outputs.ok == 'true'
        run: npm run lint --if-present
      - if: steps.has.outputs.ok == 'true'
        run: npm test --if-present
      - if: steps.has.outputs.ok == 'true'
        run: npm run build
