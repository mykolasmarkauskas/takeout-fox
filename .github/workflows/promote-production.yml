# Promote main -> production for Hostinger's Git integration.
# Hostinger serves `production` as-is (no build step), so that branch holds the compiled site.
# Runs automatically on every push to main, and by hand.
name: Promote to production (Hostinger)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: promote-production
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Skip until the project is scaffolded
        id: has
        run: test -f package.json && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has.outputs.ok == 'true'
        with: { node-version: 22, cache: npm }
      - if: steps.has.outputs.ok == 'true'
        run: npm ci
      - if: steps.has.outputs.ok == 'true'
        run: npm run lint --if-present
      - if: steps.has.outputs.ok == 'true'
        run: npm test --if-present
      - if: steps.has.outputs.ok == 'true'
        run: npm run build
      - name: Add .htaccess and version stamp
        if: steps.has.outputs.ok == 'true'
        run: |
          cat > dist/.htaccess <<'HT'
          ErrorDocument 404 /404.html
          AddType image/avif .avif
          AddType image/webp .webp
          AddType font/woff2 .woff2
          AddType model/gltf-binary .glb
          AddType application/manifest+json .webmanifest
          <IfModule mod_headers.c>
            <FilesMatch "-[A-Za-z0-9_-]{8}\.(js|css|woff2)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
            <FilesMatch "\.(png|jpg|webp|avif|svg|ogg|mp3|glb)$">
              Header set Cache-Control "public, max-age=604800"
            </FilesMatch>
            <FilesMatch "\.(html|xml|txt)$">
              Header set Cache-Control "no-cache"
            </FilesMatch>
          </IfModule>
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/css text/plain application/xml application/javascript application/json image/svg+xml
          </IfModule>
          HT
          echo "built from $(git rev-parse --short HEAD) on $(date -u +%FT%TZ)" > dist/VERSION.txt
      - name: Publish dist/ to the production branch
        if: steps.has.outputs.ok == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: production
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
          commit_message: 'deploy: ${{ github.sha }}'
